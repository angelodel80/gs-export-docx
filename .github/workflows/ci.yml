name: Verify
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: ./mvnw -B -ntp verify
      - run: npm test
      - run: docker build -t gs-export-docx:ci .
      - name: Smoke test the final container without a database
        run: bash scripts/smoke-container.sh gs-export-docx:ci
