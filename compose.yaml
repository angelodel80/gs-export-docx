services:
  exporter:
    build: .
    image: gs-export-docx:local
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      PORT: "8081"
      EXISTDB_ENABLED: ${EXISTDB_ENABLED:-false}
      EXISTDB_REST_URL: ${EXISTDB_REST_URL:-http://host.docker.internal:8080/exist/rest}
      EXISTDB_COLLECTION: ${EXISTDB_COLLECTION:-/db/gs-export}
      EXISTDB_USERNAME: ${EXISTDB_USERNAME:-}
      EXISTDB_PASSWORD: ${EXISTDB_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 768m
    cpus: 2
    pids_limit: 160
    read_only: true
    tmpfs:
      - /tmp:size=96m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 25s
    restart: unless-stopped
